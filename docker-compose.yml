# Warehouse Receiving System — db + one-shot migrate + api + web (nginx).
# Start:  ./scripts/init-env.sh && docker compose up --build
# All configuration comes from .env (generated by scripts/init-env.sh; never committed).

x-db-url: &db-url postgres://${POSTGRES_USER:?run scripts/init-env.sh}:${POSTGRES_PASSWORD:?run scripts/init-env.sh}@db:5432/${POSTGRES_DB:?run scripts/init-env.sh}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run scripts/init-env.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:?run scripts/init-env.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    # The database port is intentionally NOT published to the host.

  migrate:
    build: ./backend
    command: ["node", "dist/migrateCli.js"]
    environment:
      DATABASE_URL: *db-url
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-}
      SEED_SUPERVISOR_PASSWORD: ${SEED_SUPERVISOR_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: *db-url
      JWT_SECRET: ${JWT_SECRET:?run scripts/init-env.sh}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-28800}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
